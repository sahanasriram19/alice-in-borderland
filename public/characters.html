<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Nunito:wght@300;500;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <link href="css/base.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/color.css" rel="stylesheet" />

  <title>Characters</title>
</head>

<body>
  <div id="navbar"></div>

  <main class="py-4">
    <h1 class="home-title mb-4 text-center">Character Profiles</h1>

    <div class="container">
      <div id="msg" class="alert alert-danger d-none"></div>

      <div class="character-shell">

        <aside class="character-list">
          <div class="character-list-title">Profiles</div>
          <div id="characterList"></div>
        </aside>


        <section class="character-panel">
          <div class="character-panel-top">
            <div>
              <div id="charName" class="char-name">-</div>
              <div id="charTier" class="char-tier">-</div>
            </div>

            <div class="char-badges">
              <span id="unlockBadge" class="char-badge">-</span>
              <span id="pointsNeedBadge" class="char-badge">-</span>
            </div>
          </div>

          <div id="charDesc" class="char-desc">
            Select a character from the left.
          </div>

          <div class="char-meta">
            <div class="char-meta-row">
              <span class="char-meta-label">Required Points</span>
              <span id="reqPoints" class="char-meta-value">-</span>
            </div>
            <div class="char-meta-row">
              <span class="char-meta-label">Your Points</span>
              <span id="myPoints" class="char-meta-value">-</span>
            </div>
            <div class="char-meta-row">
              <span class="char-meta-label">Unlocked Character</span>
              <span id="myCharacter" class="char-meta-value">-</span>
            </div>
          </div>


          <div class="char-stats">
            <div class="stat-row">
              <div class="stat-label">Survival</div>
              <div class="stat-track"><div id="statSurvival" class="stat-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-label">Strategy</div>
              <div class="stat-track"><div id="statStrategy" class="stat-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-label">Agility</div>
              <div class="stat-track"><div id="statAgility" class="stat-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-label">Leadership</div>
              <div class="stat-track"><div id="statLeadership" class="stat-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-label">Composure</div>
              <div class="stat-track"><div id="statComposure" class="stat-fill"></div></div>
            </div>
          </div>


          <div class="char-portrait-wrap">
            <img id="charImg" class="char-portrait" alt="Character portrait" />
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script src="js/config.js" type="text/javascript"></script>
<script src="js/getCurrentURL.js"></script>
<script src="js/utils/token.js"></script>
<script src="js/utils/AppModals.js"></script>
<script src="js/queryCmds.js"></script>

<script src="js/requireAuth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/userNavbarToggle.js"></script>
<script src="js/logoutUser.js"></script>

<script src="js/characters.js"></script>

</body>
</html>
