<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
    <link href="css/form.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>

<main>
  <div class="profile-wrapper">

    <div class="profile-grid">

      <!-- LEFT PANEL: PLAYER FILE -->
      <div class="profile-panel">

        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2>Player profile</h2>
          <a class="btn btn-outline-light" href="dashboard.html">Back</a>
        </div>

        <div id="msg" class="alert alert-danger d-none"></div>

        <div class="info-box">
          <div class="info-label">Username</div>
          <div class="info-value" id="profileUsername"></div>
        </div>

        <div class="info-box">
          <div class="info-label">Character</div>
          <div class="info-value" id="profileCharacter"></div>
       </div>

        <div class="info-box">
          <div class="info-label">Current Points</div>
          <div class="info-value" id="profilePoints"></div>
        </div>

        <div class="info-box">
          <div class="info-label">Status</div>
          <div class="info-value">Alive in Borderland</div>
        </div>

      </div>

      <!-- RIGHT PANEL: INVENTORY -->
      <div class="profile-panel right">

        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2>Unlocked Items</h2>
          <a class="btn btn-primary" href="shop.html">Game Shop</a>
        </div>

        <div id="inventoryEmpty" class="info-label d-none">
          You haven't unlocked any items yet. Earn points by completing challenges.
        </div>

        <div id="inventoryList" class="inventory-grid"></div>

      </div>

    </div>

  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script src="js/navbar.js"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>

    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/profile.js" type="text/javascript"></script>
  </body>
</html>
