<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <link href="css/base.css" rel="stylesheet" />  
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/color.css" rel="stylesheet" />
  <title>Challenges</title>
</head>
<body class="bg-challenges">
  <div id="navbar"></div>

  <main class="py-4">
    <h1 class="home-title mb-4 text-center">Challenges</h1>

    <div class="container">

      <!-- Top bar: Points + Create button -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div id="pointsBadge" class="badge text-bg-primary p-2">Points: -</div>

        <button id="openCreateBtn" class="btn btn-outline-light">
          + Create Challenge
        </button>
      </div>

      <!-- page-level errors (rare) -->
      <div id="msg" class="alert alert-danger d-none"></div>

      <!-- Your wrapper -->
        <div class="row" id="challengeList"></div>
      </div>

  </main>

  <!-- CREATE CHALLENGE MODAL -->
  <div class="modal fade" id="createChallengeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background: rgba(6, 10, 22, 0.92); border: 1px solid rgba(255,80,100,0.35); border-radius: 18px; box-shadow: 0 0 25px rgba(255,60,80,0.35), 0 25px 70px rgba(0,0,0,0.85);">
        <div class="modal-header border-0">
          <h5 class="modal-title text-white" style="font-family: 'UnifrakturMaguntia', serif; letter-spacing: 0.04em;">
            Create a Challenge
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div id="createMsg" class="alert alert-danger d-none mb-3"></div>

          <label class="form-label text-white fw-bold" for="createDesc">Challenge Name</label>
          <input id="createDesc" class="form-control mb-3" type="text"  />

          <label class="form-label text-white fw-bold" for="createPoints">Reward Points</label>
          <input id="createPoints" class="form-control mb-3" type="number" min="1" step="1"  />

          <button id="createChallengeBtn" class="btn btn-primary w-100">
            Create Challenge
          </button>
        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-light w-100" data-bs-dismiss="modal">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

  <!-- Your app scripts -->
<!-- CORE HELPERS -->
<script src="js/getCurrentURL.js"></script>
<script src="js/token.js"></script>
<script src="js/utils/AppModals.js"></script>
<script src="js/queryCmds.js"></script>

<!-- AUTH + NAV -->
<script src="js/requireAuth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/userNavbarToggle.js"></script>
<script src="js/logoutUser.js"></script>

<!-- PAGE LOGIC (LAST) -->
<script src="js/challenges.js"></script>

</body>
</html>
